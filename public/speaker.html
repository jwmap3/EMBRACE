<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Public Talk</title>
<meta name="description" content="Details and a short form for a visiting public speaker.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E6EEE7">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg1: #DCE9E4; --bg2: #F7F1E3; --card: rgba(255, 255, 253, 0.86); --edge: rgba(255, 255, 255, 0.8);
  --fg: #1D2620; --fg2: #5C665E; --line: rgba(46, 72, 56, 0.12); --fill: rgba(46, 72, 56, 0.06);
  --accent: #2F6E4C; --accent-ink: #fff; --accent-soft: rgba(47, 110, 76, 0.12); --warn: #B4552B;
  --display: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #0B1418; --bg2: #16282A; --card: rgba(28, 38, 36, 0.9); --edge: rgba(255, 255, 255, 0.08);
    --fg: #EEF2EC; --fg2: #A2ADA4; --line: rgba(255, 255, 255, 0.1); --fill: rgba(255, 255, 255, 0.07);
    --accent: #7CC99A; --accent-ink: #0B1A12; --accent-soft: rgba(124, 201, 154, 0.16); --warn: #F29A6B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--fg); background: linear-gradient(180deg, var(--bg1), var(--bg2)) fixed; min-height: 100vh; -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 48px; }
.top { text-align: center; margin: 6px 0 20px; }
.top .cong { color: var(--accent); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 13px; }
.top h1 { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.15; margin: 6px 0 4px; }
.top p { color: var(--fg2); margin: 0; font-size: 16px; }
.card { background: var(--card); border: 1px solid var(--edge); border-radius: 20px; box-shadow: 0 8px 28px rgba(38, 64, 48, .10); padding: 4px 0; margin-bottom: 16px; }
.label { font-size: 13px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; margin: 22px 18px 8px; }
.row { display: flex; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.35; }
.row:last-child { border-bottom: 0; }
.row span:first-child { color: var(--fg2); width: 92px; flex: none; }
.row b { font-weight: 600; }
.row a { color: var(--accent); text-decoration: none; font-weight: 600; }
.q { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q > b { display: block; font-size: 17px; margin-bottom: 10px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button { font: inherit; font-size: 17px; padding: 13px 10px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--fill); color: var(--fg); cursor: pointer; }
.choices button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
input, textarea { font: inherit; font-size: 17px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--fill); color: var(--fg); }
input:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.sub { margin-top: 12px; display: grid; gap: 10px; }
.sub label { font-size: 15px; color: var(--fg2); display: grid; gap: 6px; }
.small { max-width: 140px; }
.cta { display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 600; padding: 16px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 8px; }
.cta[disabled] { opacity: .6; }
.note { text-align: center; color: var(--fg2); font-size: 15px; margin: 14px 8px 0; line-height: 1.4; }
.err { color: var(--warn); text-align: center; font-weight: 600; margin: 12px 0 0; }
.done { text-align: center; padding: 30px 22px; }
.done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 0 auto 14px; font-size: 34px; }
.done h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0 0 8px; }
.done p { color: var(--fg2); font-size: 17px; margin: 0 0 6px; line-height: 1.4; }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; padding: 10px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main id="page" aria-live="polite"><div class="top"><h1>Opening…</h1></div></main>
<script src="firebase-config.js?v=5.18"></script>
<script src="speaker.js?v=5.18"></script>
</body>
</html>
