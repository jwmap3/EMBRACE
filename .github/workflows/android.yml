# Builds Embrace.apk (the Android app) and posts it under Releases for download.
# The app opens jwmap3.github.io/EMBRACE, so most updates reach phones without a new APK.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.EMBRACE_KEYSTORE }}
          KEYSTORE_PW: ${{ secrets.EMBRACE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/app/release.jks -alias embrace -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Embrace"
            echo "::add-mask::$PW"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Embrace.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Embrace-apk
          path: Embrace.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Embrace for Android
          body: |
            Download **Embrace.apk** below on an Android phone and open it to install.
            If the phone asks, allow installing apps from your browser.
          files: Embrace.apk
          make_latest: true
